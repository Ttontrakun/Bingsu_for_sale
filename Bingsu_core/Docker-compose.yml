# bb - รันทั้ง Backend + Supportadmin ใน Docker (Postgres, Qdrant, Redis, Legacy, Supportadmin)
# ใช้: cd Bingsu_core && docker compose --profile app up -d --build
# Supportadmin: http://localhost:3014  |  API (legacy): http://localhost:5052
#
# Data-plane (postgres/redis/qdrant/ocr) bind 127.0.0.1 เท่านั้น — โดเมนผู้ใช้ไม่กระทบ

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ask_the_manual
    ports:
      - "127.0.0.1:5436:5432"
    volumes:
      - bb_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ask_the_manual"]
      interval: 5s
      timeout: 5s
      retries: 5

  qdrant:
    image: qdrant/qdrant:latest
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    ports:
      - "127.0.0.1:6336:6333"
    volumes:
      - bb_qdrant_data:/qdrant/storage

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    command: ["sh", "-c", "exec redis-server --requirepass \"$$REDIS_PASSWORD\""]
    ports:
      - "127.0.0.1:6382:6379"
    volumes:
      - bb_redis_data:/data

  ocr:
    build:
      context: ./Backend/Service/Ocr
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    ports:
      - "127.0.0.1:8001:8001"
    volumes:
      # Cache downloaded OCR models so container recreation doesn't re-download them
      - bb_ocr_models:/root/.paddlex
      - bb_ocr_cache:/root/.cache
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 60s

  legacy:
    build:
      context: ./Backend
      dockerfile: Dockerfile.legacy
    restart: unless-stopped
    env_file:
      - ./Backend/.env
    environment:
      PORT: "5052"
      NODE_ENV: production
      SESSION_COOKIE_SECURE: "true"
      # บังคับ host ภายใน Docker (ค่าใน .env อาจชี้ localhost สำหรับ dev บนโฮสต์)
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ask_the_manual?schema=public
      QDRANT_URL: http://qdrant:6333
      OCR_API_URL: http://ocr:8001
      UPLOAD_QUEUE_MODE: redis
      STORE_RAW_FILES: "true"
      FILE_STORAGE_PROVIDER: local
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
      redis:
        condition: service_started
      ocr:
        condition: service_started
    ports:
      - "5052:5052"
    volumes:
      - bb_uploads:/app/uploads
      - bb_files:/app/.files
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://127.0.0.1:5052/api/ping"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 90s
    command: sh -c "npx prisma migrate deploy && node server/index.js"

  supportadmin:
    build:
      context: ./Frontend/Supportadmin
      dockerfile: Dockerfile
      args:
        # ใช้ origin ของหน้าเว็บ + nginx proxy /api (cookie ทำงานถูกต้อง)
        REACT_APP_API_BASE_URL: ""
    ports:
      - "3014:80"
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "8083:80"
    restart: unless-stopped

volumes:
  bb_postgres_data:
  bb_qdrant_data:
  bb_redis_data:
  bb_ocr_models:
  bb_ocr_cache:
  bb_uploads:
  bb_files:
